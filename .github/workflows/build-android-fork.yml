# Fork-local build: Android arm64 (arm64-v8a) release APK for the
# cloud-sync-ungated build. Mirrors android-e2e.yml / nightly.yml's Android
# scaffolding, with two fork-specific differences:
#
#   - the APK is signed with the fork's own keystore, held in repo secrets
#     (ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD). The
#     official ANDROID_KEY_* secrets do not exist in a fork, and the key must NOT
#     be regenerated per run: Android refuses to install an update signed by a
#     different key, so a throwaway key would force an uninstall — and local data
#     loss — on every rebuild. The step below fails loudly rather than fall back
#     to a fresh key, and prints the certificate fingerprint so two builds can be
#     compared at a glance.
#   - nothing is published: no R2 upload, no GitHub release, no updater .sig.
#
# Lives on its own branch so pushing it does not re-trigger the Windows workflow.
name: Build Android arm64 APK (fork)

on:
  push:
    branches:
      - build/android-arm64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v4

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      # Run before the (slow) Rust build so a bad edit fails fast.
      - name: type check
        working-directory: apps/readest-app
        run: pnpm exec tsc --noEmit

      # The whole suite, not a hand-picked file list: a filtered run once reported
      # success here while another test file was failing.
      - name: unit tests
        working-directory: apps/readest-app
        run: pnpm test:pr:web:unit

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: fork-android-arm64-cargo

      - name: decode the signing keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to build an"
            echo "::error::APK signed with a throwaway key, which could never be"
            echo "::error::upgraded in place. Set ANDROID_KEYSTORE_BASE64 along with"
            echo "::error::ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, then re-run."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/fork-release.jks"

          # Record the identity of the key that signs this build. Two builds are
          # upgrade-compatible exactly when these fingerprints match.
          echo '--- signing certificate ---'
          keytool -list -v \
            -keystore "$RUNNER_TEMP/keystore/fork-release.jks" \
            -storepass "$ANDROID_KEY_PASSWORD" 2>/dev/null \
            | grep -E 'Alias name|Certificate fingerprint \(SHA256\)' || true

      - name: build release APK (arm64)
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          NODE_OPTIONS: '--max-old-space-size=8192'
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Only the customized files of gen/android are tracked — regenerate the
          # gradle scaffolding, then restore the tracked customizations.
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .

          # build.gradle.kts loads rootProject/keystore.properties when it exists
          # and only then applies the "signing" config to the release variant.
          pushd src-tauri/gen/android
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/keystore/fork-release.jks"
          } > keystore.properties
          popd

          pnpm tauri android build \
            --target aarch64 \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

          echo '--- produced APKs ---'
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec ls -la {} \;

      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: readest-android-arm64-apk
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
